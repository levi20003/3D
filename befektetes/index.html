<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Befektetés</title>
<meta name="description" content="Saját befektetési portfólió: Lightyear kivonatok, élő árfolyamok, S&P 500 összehasonlítás.">
<meta name="theme-color" content="#f5f6f8" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: egyoszlopos app; fent márka + eszközök, a kezdőlapon nagy árfolyamgrafikon; telefonon alsó navigáció. */
:root{
  --bg:#f2f1eb; --surface:#fbfaf6; --surface-2:#eceae2; --ink:#13241c; --muted:#6b756e; --line:#e2e0d6;
  --accent:#1e4636; --accent-soft:#e3ebe3; --accent-ink:#f7f6f0;
  --gain:#2d8a57; --loss:#c8533f; --tile:#e5e3da; --bench:#9aa39c;
  --hero:#1e4334; --hero-2:#14302400; --hero-ink:#f5f3ea; --hero-muted:rgba(245,243,234,.66); --hero-line:rgba(245,243,234,.16); --hero-up:#b4e3c4; --hero-down:#ffb3a3; --hero-bench:#f5f3ea88;
  --c1:#1e4636; --c2:#3d7a59; --c3:#78ab8c; --c4:#b5d0bd; --c5:#d8e3d6; --c6:#a8ada6;
  --p1:#1e4636; --p2:#e0a43c; --p3:#4f9b78; --p4:#df7356; --p5:#5f86b5; --p6:#a3c9a8; --p7:#9a72c4; --p8:#c9b07a; --p9:#3fa9b5; --p10:#8a8f87;
  --f-ui:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-num:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --r:22px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b100d; --surface:#121a16; --surface-2:#1a241f; --ink:#eef2ec; --muted:#8f9a93; --line:#223029;
  --accent:#9fd1b2; --accent-soft:#1a2a22; --accent-ink:#0b100d;
  --gain:#62cf91; --loss:#f08a74; --tile:#1b2621; --bench:#6d786f;
  --hero:#173a2b; --hero-ink:#f1f3ec; --hero-muted:rgba(241,243,236,.62); --hero-line:rgba(241,243,236,.13); --hero-up:#9fe0b9; --hero-down:#ffab98; --hero-bench:#f1f3ec77;
  --c1:#9fd1b2; --c2:#6aa985; --c3:#3f7a5b; --c4:#2a5541; --c5:#1f3b2f; --c6:#56605a;
  --p1:#9fd1b2; --p2:#f0bc5e; --p3:#4fb98a; --p4:#f08c70; --p5:#86a9d8; --p6:#2f7d5c; --p7:#b99ae0; --p8:#e0cb98; --p9:#5fc6d1; --p10:#a3aaa2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b100d; --surface:#121a16; --surface-2:#1a241f; --ink:#eef2ec; --muted:#8f9a93; --line:#223029;
  --accent:#9fd1b2; --accent-soft:#1a2a22; --accent-ink:#0b100d;
  --gain:#62cf91; --loss:#f08a74; --tile:#1b2621; --bench:#6d786f;
  --hero:#173a2b; --hero-ink:#f1f3ec; --hero-muted:rgba(241,243,236,.62); --hero-line:rgba(241,243,236,.13); --hero-up:#9fe0b9; --hero-down:#ffab98; --hero-bench:#f1f3ec77;
  --c1:#9fd1b2; --c2:#6aa985; --c3:#3f7a5b; --c4:#2a5541; --c5:#1f3b2f; --c6:#56605a;
  --p1:#9fd1b2; --p2:#f0bc5e; --p3:#4fb98a; --p4:#f08c70; --p5:#86a9d8; --p6:#2f7d5c; --p7:#b99ae0; --p8:#e0cb98; --p9:#5fc6d1; --p10:#a3aaa2; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum","ss01"}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);padding-block:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
.brand svg{width:26px;height:26px;border-radius:8px}
.tools{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.ibtn{border:0;background:var(--surface-2);height:34px;min-width:34px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;font-size:.85rem;font-weight:500}
.ibtn svg{width:16px;height:16px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 12px 10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.bnav{display:none}
@media (max-width:700px){
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;color:var(--muted);text-decoration:none;padding:4px 0}
  .bnav a svg{width:20px;height:20px}
  .bnav a[aria-current="page"]{color:var(--accent)}
}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;padding:6px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status a{text-decoration:none;font-weight:500;color:var(--ink)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--gain);display:inline-block}
.status i.off{background:var(--muted)} .status i.busy{background:var(--accent)}

main{padding-top:16px;display:flex;flex-direction:column;gap:18px}
h2{font-size:1.05rem;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.84rem;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cv{position:relative;height:280px}
.lbl-s{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.big{font-size:clamp(2.6rem,11vw,4.2rem);font-weight:500;line-height:1;letter-spacing:-.045em;margin-top:6px}
.big .cur{font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:-.01em;margin-left:.18em}
.big .cur.pre{margin:0 .06em 0 0}
.chg{font-weight:500;font-size:.95rem;margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.chg small{color:var(--muted);font-weight:500;font-size:.82rem}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-weight:600;font-size:.9rem;margin-top:10px}
.pill.pos{background:color-mix(in srgb,var(--gain) 14%,transparent)} .pill.neg{background:color-mix(in srgb,var(--loss) 14%,transparent)}

/* big chart */
.stock{padding:10px 0 4px}
.chart{position:relative;height:clamp(300px,48vw,420px);margin:18px 0 0;touch-action:pan-y;cursor:crosshair}
.chart.bleed{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)))}
@media (min-width:1112px){.chart.bleed{margin-inline:0}}
.ranges2{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.ranges2 button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.8rem;white-space:nowrap;padding:8px 0;border-radius:999px;cursor:pointer;letter-spacing:.01em}
.ranges2 button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.opts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.chart canvas{display:block;width:100%;height:100%}
.ranges{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ranges .seg button{padding:5px 10px}
.toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:14px;height:2px;background:var(--bench);display:inline-block}
.keys{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:16px;height:0;border-top:2px solid var(--line);display:inline-block}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-top:6px}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);padding:13px 15px;min-width:0}
.stat .v{font-size:1.12rem;font-weight:600;margin-top:2px;overflow-wrap:anywhere}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.tk{width:46px;height:30px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.72rem;letter-spacing:.02em}
.li .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:.8rem;color:var(--muted)}
.li .r{text-align:right}

.tm{position:relative;height:420px;border-radius:10px;overflow:hidden}
@media (max-width:520px){.tm{height:360px}}
.tile{position:absolute;border:2px solid var(--surface);border-radius:8px;padding:8px 9px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink);transition:filter .15s}
.tile:hover{filter:brightness(1.06)}
.tile b{font-size:.9rem} .tile span{font-size:.78rem;line-height:1.35;white-space:nowrap} .tile .tp{font-size:.95rem;font-weight:600} .tile .tvv{opacity:.7}
.legend{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--muted);margin-top:10px}
.legend i{flex:0 1 160px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--loss),var(--tile),var(--gain))}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:500;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
th:first-child,td:first-child,.l{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}

.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
input[type=range]{accent-color:var(--accent);width:min(220px,100%)}
input[type=search],input[type=text],input[type=password]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:500}
.tip{display:flex;gap:12px;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:.9rem}
.tip svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:2px}
.tip p{margin:0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--loss);border:1px solid var(--line)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:.9rem}

.onb{max-width:560px;margin:8vh auto 0;display:flex;flex-direction:column;gap:18px}
.onb h1{font-size:2rem;letter-spacing:-.03em;margin:0;line-height:1.1}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:.92rem}
.steps li{display:flex;gap:10px}
.steps b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem}

.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:30}
.sheet{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:500}
.month{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:14px 4px 4px;font-weight:500}
.updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:45;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--bg);padding:8px 8px 8px 16px;border-radius:999px;font-size:.9rem;font-weight:600;box-shadow:0 8px 28px rgb(0 0 0 / .3);max-width:calc(100vw - 24px);width:max-content;white-space:nowrap}
.updbar[hidden]{display:none}
.updbar button{border:0;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;padding:8px 14px;background:var(--bg);color:var(--ink)}
.updbar .x{background:transparent;color:inherit;padding:8px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;max-width:min(92vw,520px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}

/* lebegő kártyák, eszközsor, fánk, lebegő adatkártya */
:root{--shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px -8px rgb(0 0 0 / .12);--glass:color-mix(in srgb,var(--surface) 78%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:0 1px 0 rgb(255 255 255 / .04) inset,0 12px 32px -12px rgb(0 0 0 / .7)}}
:root[data-theme="dark"]{--shadow:0 1px 0 rgb(255 255 255 / .04) inset,0 12px 32px -12px rgb(0 0 0 / .7)}
.card{box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.card.lift:hover{transform:translateY(-2px)}
.fstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.fstats{grid-template-columns:1fr 1fr}}
.fcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 13px;box-shadow:var(--shadow);min-width:0;transition:transform .2s ease}
.fcard:hover{transform:translateY(-2px)}
.fcard .v{font-size:1.15rem;font-weight:600;margin-top:2px;overflow-wrap:anywhere;letter-spacing:-.01em}
.fic{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.fic svg{width:14px;height:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 14px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding-inline:max(16px, env(safe-area-inset-left, 0px));scroll-padding-inline:max(16px, env(safe-area-inset-left, 0px))}
.rail::-webkit-scrollbar{display:none}
@media (min-width:1112px){.rail{margin-inline:0;padding-inline:2px}}
.acard{flex:0 0 168px;scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .2s ease,border-color .2s}
.acard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ink) 18%,var(--line))}
.acard:active{transform:scale(.98)}
.acard .ah{display:flex;justify-content:space-between;align-items:center}
.acard .ach{font-size:.8rem;font-weight:600}
.acard .an{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}
.acard .sp{width:100%;height:44px;margin:6px 0 4px}
.acard .av{font-weight:600;font-size:1.02rem}
.ftip{position:absolute;left:0;top:0;pointer-events:none;background:var(--glass);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:.8rem;box-shadow:var(--shadow);min-width:132px;z-index:2;transition:transform .06s linear}
.ftip .td{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.ftip .tv{font-size:1rem;font-weight:600;margin:1px 0}
.ftip .tb{color:var(--muted);display:flex;align-items:center;gap:6px}
.ftip .tb i{width:10px;height:2px;background:var(--bench);display:inline-block}
.donut-wrap{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.donut-wrap{grid-template-columns:1fr}}
.donut{position:relative;width:100%;max-width:240px;aspect-ratio:1;margin:0 auto}
.donut canvas{width:100%;height:100%;display:block;cursor:pointer;touch-action:none}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}

main.enter > *:nth-child(2){animation-delay:.04s} main.enter > *:nth-child(3){animation-delay:.08s} main.enter > *:nth-child(4){animation-delay:.12s} main.enter > *:nth-child(5){animation-delay:.16s} main.enter > *:nth-child(n+6){animation-delay:.2s}
.bar.scrolled{box-shadow:0 10px 24px -18px rgb(0 0 0 / .45)}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:25;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--accent);opacity:0;transform:translate(-50%,-50px);transition:opacity .2s,transform .25s;pointer-events:none}
#ptr svg{width:18px;height:18px} #ptr.on{opacity:1!important;transform:translate(-50%,52px)!important} #ptr.on svg{animation:spin .8s linear infinite}
button,a{-webkit-tap-highlight-color:transparent}
.qa button,.acard,.prow,.txr,.chip,.bw,.insight{transition:transform .15s ease,background .15s}
.chip:active,.insight:active,.bw:active,.txr:active{transform:scale(.97)}
html{scroll-behavior:auto}

/* ---- diagnosztika, részvénylap fejléc ---- */
.dg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.dg i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-top:6px} .dg i.ok{background:var(--gain)} .dg i.bad{background:var(--loss)}
.dg b{display:block;font-size:.88rem} .dg small{display:block;color:var(--muted);font-size:.78rem;word-break:break-word}
.dgout{background:var(--surface-2);border-radius:12px;padding:10px;font-size:.72rem;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;margin:0}
.tk-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tkh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap} .tkh b{font-size:1.35rem;font-weight:800;letter-spacing:-.02em} .tkh small{color:var(--muted);font-size:.78rem}
.seg button.soft{opacity:.55}

/* ---- kézi rögzítés, mentés ---- */
.mform{display:flex;flex-direction:column;gap:14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
.mf input,.mf select{font:inherit;font-size:1rem;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.mf input:focus,.mf select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.mt-t{grid-column:1/-1}
.msum{display:flex;gap:8px;flex-wrap:wrap} .msum:empty{display:none}
.msum span{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:.82rem;color:var(--muted)} .msum b{color:var(--ink);margin-left:4px}
.msum .mwarn{flex-basis:100%;background:color-mix(in srgb,var(--p2) 18%,transparent);color:var(--ink)}
.merr{color:var(--loss);font-size:.86rem;margin:0;min-height:1em} .merr:empty{display:none}
.mtag{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--p2) 22%,transparent);color:var(--ink);vertical-align:1px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;font-weight:400;color:var(--ink)} .ck input{margin-top:3px;accent-color:var(--accent)}
.shprev{border-radius:18px;overflow:hidden;background:#0d2219;box-shadow:var(--shadow)} .shprev canvas{display:block;width:100%;height:auto}

/* ---- CSV-hozzárendelés, Wrapped ---- */
.cmtypes{display:flex;flex-direction:column;gap:6px}
.cmt{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:.86rem} .cmt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-num)}
.cmt select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.wcta{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:24px;padding:18px 20px;cursor:pointer;color:#f5f3ea;text-align:left;
  background:linear-gradient(120deg,#1e4636 0%,#3d7a59 45%,#e0a43c 100%);box-shadow:0 14px 30px -16px rgb(30 70 54 / .8);transition:transform .15s}
.wcta:active{transform:scale(.98)} .wcta small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8} .wcta b{font-size:1.25rem;font-weight:800}
.wcta i{width:36px;height:36px;border-radius:50%;background:rgb(255 255 255 / .18);display:flex;align-items:center;justify-content:center} .wcta svg{width:18px;height:18px}
.wrap-ov{position:fixed;inset:0;z-index:60;background:#0b1a13;color:#f5f3ea;display:flex;flex-direction:column}
.wprog{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:5px;z-index:3}
.wprog i{flex:1;height:3px;border-radius:2px;background:rgb(255 255 255 / .25);overflow:hidden} .wprog i b{display:block;height:100%;width:0;background:#f5f3ea}
.wprog i.done b{width:100%} .wprog i.run b{animation:wfill 6s linear forwards}
@keyframes wfill{to{width:100%}}
.wx{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:4;border:0;background:rgb(255 255 255 / .16);color:#f5f3ea;width:38px;height:38px;border-radius:50%;font-size:1rem;cursor:pointer}
.wnav{position:absolute;top:0;bottom:0;width:38%;border:0;background:transparent;z-index:2;cursor:pointer} .wl{left:0} .wr{right:0;width:62%}
.wslide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:80px max(28px,env(safe-area-inset-left,0px)) calc(60px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;width:100%}
.wslide > *{opacity:0;transform:translateY(16px)} .wslide.in > *{animation:wup .6s cubic-bezier(.2,.8,.2,1) forwards} .wslide.in > *:nth-child(2){animation-delay:.08s} .wslide.in > *:nth-child(3){animation-delay:.16s} .wslide.in > *:nth-child(4){animation-delay:.24s} .wslide.in > *:nth-child(n+5){animation-delay:.32s}
@keyframes wup{to{opacity:1;transform:none}}
.wrap-ov:has(.w1){background:radial-gradient(120% 80% at 80% 0%,#2f6b50,#0f2a1f 70%)} .wrap-ov:has(.w2){background:radial-gradient(120% 80% at 20% 100%,#3d8a62,#10291e 70%)}
.wrap-ov:has(.w3){background:radial-gradient(120% 80% at 80% 100%,#b5862e,#2a2010 75%)} .wrap-ov:has(.w4){background:radial-gradient(120% 80% at 0% 0%,#5f86b5,#121c2b 75%)} .wrap-ov:has(.w5){background:radial-gradient(120% 80% at 50% 0%,#b4513f,#2a120e 75%)}
.wslide small{font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.wslide p{font-size:1.1rem;margin:0;opacity:.85} .wslide .wsub{font-size:1.3rem;font-weight:700;opacity:1}
.wbig{font-size:clamp(3.4rem,16vw,5.5rem);line-height:.95;letter-spacing:-.04em;font-weight:800;margin:0}
.wnum{font-size:clamp(4rem,22vw,7.5rem);line-height:.9;letter-spacing:-.05em;font-weight:800;margin:0}
.wmid{font-size:clamp(2.2rem,10vw,3.4rem);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0}
.wnum2{font-size:clamp(2.6rem,13vw,4.2rem);font-weight:800;letter-spacing:-.04em;margin:6px 0 0} .wrap-ov .up{color:#b4e3c4} .wrap-ov .down{color:#ffb3a3}
.wbadge{align-self:flex-start;background:rgb(255 255 255 / .14);border-radius:99px;padding:10px 16px;font-weight:700}
.wslide .lg{box-shadow:0 12px 30px -10px rgb(0 0 0 / .5)}
.wsecs{display:flex;flex-direction:column;gap:10px;margin-top:10px} .wsecs div{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:.9rem}
.wsecs i{height:10px;border-radius:5px;display:block} .wsecs b{text-align:right}
.wslide .ob-btn{margin-top:20px;position:relative;z-index:5}
@media (max-width:480px){.tools{gap:6px}.ibtn{width:38px;height:38px;min-width:38px}.seg button{padding:5px 9px}.hello small{max-width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
