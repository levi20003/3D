<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Befektetés</title>
<meta name="description" content="Saját befektetési portfólió: Lightyear kivonatok, élő árfolyamok, S&P 500 összehasonlítás.">
<meta name="theme-color" content="#f5f6f8" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: egyoszlopos app; fent márka + eszközök, a kezdőlapon nagy árfolyamgrafikon; telefonon alsó navigáció. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --ink:#121722; --muted:#626b7c; --line:#e1e4ea;
  --accent:#2f5bea; --accent-soft:#e6ecfd; --accent-ink:#ffffff;
  --gain:#14915a; --loss:#d13d35; --tile:#e9ebf0; --bench:#8a93a6;
  --f-ui:"Geist","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-num:"Geist Mono",ui-monospace,"SFMono-Regular","Roboto Mono",Menlo,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12; --surface:#141821; --surface-2:#1b202b; --ink:#eef1f6; --muted:#949db0; --line:#262c38;
  --accent:#7d9bff; --accent-soft:#1f2a4a; --accent-ink:#0b0d12;
  --gain:#3ccf8a; --loss:#ff6b61; --tile:#222835; --bench:#7c859a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#141821; --surface-2:#1b202b; --ink:#eef1f6; --muted:#949db0; --line:#262c38;
  --accent:#7d9bff; --accent-soft:#1f2a4a; --accent-ink:#0b0d12;
  --gain:#3ccf8a; --loss:#ff6b61; --tile:#222835; --bench:#7c859a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-block:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.tools{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.ibtn{border:1px solid var(--line);background:var(--surface);height:34px;min-width:34px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;font-size:.85rem;font-weight:500}
.ibtn svg{width:16px;height:16px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 12px 10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.92rem;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.bnav{display:none}
@media (max-width:700px){
  .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);text-decoration:none;padding:4px 0}
  .bnav a svg{width:20px;height:20px}
  .bnav a[aria-current="page"]{color:var(--accent)}
}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;padding:8px 0 0}
.status i{width:7px;height:7px;border-radius:50%;background:var(--gain);display:inline-block}
.status i.off{background:var(--muted)} .status i.busy{background:var(--accent)}

main{padding-top:16px;display:flex;flex-direction:column;gap:18px}
h2{font-size:1.05rem;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.84rem;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cv{position:relative;height:280px}
.lbl-s{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.big{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:600;line-height:1.05;letter-spacing:-.03em;margin-top:4px}
.chg{font-weight:600;font-size:.98rem;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.chg small{color:var(--muted);font-weight:500;font-size:.82rem}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-weight:600;font-size:.9rem;margin-top:10px}
.pill.pos{background:color-mix(in srgb,var(--gain) 14%,transparent)} .pill.neg{background:color-mix(in srgb,var(--loss) 14%,transparent)}

/* big chart */
.stock{padding:18px 18px 12px}
.chart{position:relative;height:clamp(300px,42vw,400px);margin:14px -6px 0;touch-action:pan-y;cursor:crosshair}
.chart canvas{display:block;width:100%;height:100%}
.ranges{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ranges .seg button{padding:5px 10px}
.toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:14px;height:2px;background:var(--bench);display:inline-block}
.keys{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:16px;height:0;border-top:2px solid var(--line);display:inline-block}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);padding:13px 15px;min-width:0}
.stat .v{font-size:1.12rem;font-weight:600;margin-top:2px;overflow-wrap:anywhere}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.tk{width:46px;height:30px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.72rem;letter-spacing:.02em}
.li .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:.8rem;color:var(--muted)}
.li .r{text-align:right}

.tm{position:relative;height:420px;border-radius:10px;overflow:hidden}
@media (max-width:520px){.tm{height:360px}}
.tile{position:absolute;border:2px solid var(--surface);border-radius:8px;padding:8px 9px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink);transition:filter .15s}
.tile:hover{filter:brightness(1.06)}
.tile b{font-size:.9rem} .tile span{font-size:.78rem}
.legend{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--muted);margin-top:10px}
.legend i{flex:0 1 160px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--loss),var(--tile),var(--gain))}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:500;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
th:first-child,td:first-child,.l{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}

.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
input[type=range]{accent-color:var(--accent);width:min(220px,100%)}
input[type=search],input[type=text],input[type=password]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:500}
.tip{display:flex;gap:12px;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:.9rem}
.tip svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:2px}
.tip p{margin:0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--loss);border:1px solid var(--line)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:.9rem}

.onb{max-width:560px;margin:8vh auto 0;display:flex;flex-direction:column;gap:18px}
.onb h1{font-size:2rem;letter-spacing:-.03em;margin:0;line-height:1.1}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:.92rem}
.steps li{display:flex;gap:10px}
.steps b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem}

.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:30}
.sheet{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:500}
.month{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:14px 4px 4px;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;max-width:min(92vw,520px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar" id="bar" hidden>
    <div class="row">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--ink)"/><path d="M8 21l5-6 4 3 7-8" stroke="var(--bg)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Befektetés
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Pénznem"><button id="cHUF">Ft</button><button id="cUSD">$</button></div>
        <button class="ibtn" id="refreshBtn" aria-label="Árfolyamok frissítése"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg></button>
        <button class="ibtn" id="themeBtn" aria-label="Téma"></button>
        <button class="ibtn" id="setBtn" aria-label="Beállítások"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </div>
    <div class="status" id="status"></div>
    <nav class="tabs" id="tabs" aria-label="Nézetek"></nav>
  </header>
  <main id="main"></main>
</div>
<nav class="bnav" id="bnav" aria-label="Nézetek" hidden></nav>
<div id="sheetRoot"></div>
<input type="file" id="fileIn" accept="application/pdf,.pdf" multiple hidden>

<script src="parser.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
